<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Xprinter PDF Сдвиг</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';document.head.appendChild(s);"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 20px 16px; background: #111315; color: #f2f4f7; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 440px; background: #1b1e22; border-radius: 16px; padding: 20px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    .sub { font-size: 13px; color: #98a2b3; margin: 0 0 16px; }
    .file-btn { display: block; width: 100%; padding: 16px; background: #2563eb; color: #fff; text-align: center; border-radius: 12px; font-size: 16px; font-weight: 600; margin-bottom: 16px; cursor: pointer; }
    .file-btn:active { background: #1d4ed8; }
    input[type="file"] { display: none; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: #121417; padding: 4px; border-radius: 10px; border: 1px solid #2e333a; margin-bottom: 12px; }
    .tab-btn { padding: 10px 8px; border: none; border-radius: 8px; background: transparent; color: #98a2b3; font-size: 14px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: #2e333a; color: #fff; }

    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .preset-btn { padding: 10px 8px; border-radius: 10px; border: 1px solid #2e333a; background: #121417; color: #e4e7ec; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
    .preset-btn:active { background: #2563eb; border-color: #2563eb; color: #fff; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    label.field { display: block; font-size: 12px; color: #98a2b3; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2e333a; background: #121417; color: #fff; font-size: 16px; }
    .check-row { display: flex; align-items: center; gap: 10px; background: #121417; padding: 12px; border-radius: 10px; border: 1px solid #2e333a; margin-bottom: 16px; font-size: 14px; }
    input[type="checkbox"] { width: 20px; height: 20px; accent-color: #2563eb; }
    .action-btn { display: block; width: 100%; padding: 16px; background: #2e333a; color: #98a2b3; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; margin-bottom: 10px; cursor: pointer; }
    .action-btn.ready { background: #16a34a; color: #fff; }
    .action-btn.ready:active { background: #15803d; }
    .alt-link { display: none; text-align: center; color: #60a5fa; font-size: 14px; text-decoration: none; padding: 8px; }
    .status { font-size: 13px; color: #98a2b3; text-align: center; min-height: 20px; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сдвиг PDF для Xprinter</h1>
    <p class="sub">Векторная коррекция полей без потери качества</p>

    <label class="file-btn" for="pdfInput">Выбрать PDF с этикетками</label>
    <input type="file" id="pdfInput" accept="application/pdf,.pdf">

    <div class="tabs">
      <button type="button" class="tab-btn active" id="modeCenterBtn">По центру</button>
      <button type="button" class="tab-btn" id="modeShiftBtn">Сдвиг вправо</button>
    </div>

    <div class="presets">
      <button type="button" class="preset-btn" data-mode="center" data-shift="0" data-scale="92">Центр 92% (узкие поля)</button>
      <button type="button" class="preset-btn" data-mode="center" data-shift="0" data-scale="88">Центр 88% (широкие поля)</button>
      <button type="button" class="preset-btn" data-mode="shift" data-shift="2.5" data-scale="93">Сдвиг +2.5 мм (93%)</button>
      <button type="button" class="preset-btn" data-mode="shift" data-shift="3.5" data-scale="91">Сдвиг +3.5 мм (91%)</button>
    </div>

    <div class="grid">
      <div>
        <label class="field" id="shiftLabel" for="shiftMm">Доп. сдвиг (мм)</label>
        <input type="number" id="shiftMm" step="0.5" value="0">
      </div>
      <div>
        <label class="field" for="scalePct">Масштаб (%)</label>
        <input type="number" id="scalePct" step="1" value="90">
      </div>
    </div>

    <label class="check-row">
      <input type="checkbox" id="skipFirst" checked>
      <span>Не трогать 1-ю страницу (оставить как есть)</span>
    </label>

    <button class="action-btn" id="shareBtn">Отправить в Xprinter</button>
    <a class="alt-link" id="openLink" target="_blank">Открыть PDF в новой вкладке</a>
    <div class="status" id="status">Ожидание PDF-файла...</div>
  </div>

  <script>
    const pdfInput = document.getElementById('pdfInput');
    const modeCenterBtn = document.getElementById('modeCenterBtn');
    const modeShiftBtn = document.getElementById('modeShiftBtn');
    const shiftLabel = document.getElementById('shiftLabel');
    const shiftInput = document.getElementById('shiftMm');
    const scaleInput = document.getElementById('scalePct');
    const skipFirstInput = document.getElementById('skipFirst');
    const shareBtn = document.getElementById('shareBtn');
    const openLink = document.getElementById('openLink');
    const statusEl = document.getElementById('status');

    let alignMode = 'center';
    let currentFile = null;
    let outputBlob = null;
    let currentBlobUrl = null;
    let outputFileName = 'label_fixed.pdf';

    function updateModeUI(mode) {
      alignMode = mode;
      if (mode === 'center') {
        modeCenterBtn.classList.add('active');
        modeShiftBtn.classList.remove('active');
        shiftLabel.textContent = 'Доп. сдвиг от центра (мм)';
      } else {
        modeShiftBtn.classList.add('active');
        modeCenterBtn.classList.remove('active');
        shiftLabel.textContent = 'Отступ слева (мм)';
      }
    }

    try {
      const savedMode = localStorage.getItem('xp_mode') || 'center';
      updateModeUI(savedMode);
      if (localStorage.getItem('xp_shift') !== null) shiftInput.value = localStorage.getItem('xp_shift');
      if (localStorage.getItem('xp_scale') !== null) scaleInput.value = localStorage.getItem('xp_scale');
      if (localStorage.getItem('xp_skip1') !== null) skipFirstInput.checked = localStorage.getItem('xp_skip1') === 'true';
    } catch (e) {}

    function saveSettings() {
      try {
        localStorage.setItem('xp_mode', alignMode);
        localStorage.setItem('xp_shift', shiftInput.value);
        localStorage.setItem('xp_scale', scaleInput.value);
        localStorage.setItem('xp_skip1', skipFirstInput.checked);
      } catch (e) {}
    }

    async function processPDF() {
      saveSettings();
      if (!currentFile) return;

      if (typeof PDFLib === 'undefined') {
        statusEl.textContent = 'Модуль PDF ещё загружается — подождите 2 секунды и выберите файл снова.';
        return;
      }

      statusEl.textContent = 'Обработка страниц...';
      try {
        const arrayBuffer = await currentFile.arrayBuffer();
        const { PDFDocument } = PDFLib;
        const srcDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        const outDoc = await PDFDocument.create();

        const pageCount = srcDoc.getPageCount();
        const shiftMm = parseFloat(shiftInput.value) || 0;
        const scale = (parseFloat(scaleInput.value) || 100) / 100;
        const skipFirst = skipFirstInput.checked;
        const mmToPt = 2.83465;

        for (let i = 0; i < pageCount; i++) {
          if (i === 0 && skipFirst) {
            const [copiedPage] = await outDoc.copyPages(srcDoc, [0]);
            outDoc.addPage(copiedPage);
          } else {
            const srcPage = srcDoc.getPage(i);
            const { width, height } = srcPage.getSize();
            const embeddedPage = await outDoc.embedPage(srcPage);
            const newPage = outDoc.addPage([width, height]);

            const scaledW = width * scale;
            const scaledH = height * scale;
            const xOffset = alignMode === 'center'
              ? ((width - scaledW) / 2) + (shiftMm * mmToPt)
              : shiftMm * mmToPt;
            const yOffset = (height - scaledH) / 2;

            newPage.drawPage(embeddedPage, {
              x: xOffset,
              y: yOffset,
              width: scaledW,
              height: scaledH
            });
          }
        }

        const pdfBytes = await outDoc.save();
        outputBlob = new Blob([pdfBytes], { type: 'application/pdf' });
        outputFileName = 'fixed_' + currentFile.name;

        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = URL.createObjectURL(outputBlob);

        openLink.href = currentBlobUrl;
        openLink.style.display = 'block';
        shareBtn.classList.add('ready');

        const shifted = skipFirst ? Math.max(0, pageCount - 1) : pageCount;
        const modeText = alignMode === 'center' ? `центр, ${scaleInput.value}%` : `сдвиг ${shiftMm} мм, ${scaleInput.value}%`;
        statusEl.textContent = `Готово (${modeText}): страниц ${pageCount}, изменено ${shifted}`;
      } catch (err) {
        statusEl.textContent = 'Ошибка PDF: ' + err.message;
      }
    }

    modeCenterBtn.addEventListener('click', () => {
      updateModeUI('center');
      shiftInput.value = '0';
      if (parseFloat(scaleInput.value) > 95) scaleInput.value = '90';
      processPDF();
    });

    modeShiftBtn.addEventListener('click', () => {
      updateModeUI('shift');
      if (parseFloat(shiftInput.value) === 0) shiftInput.value = '3';
      processPDF();
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        updateModeUI(btn.dataset.mode);
        shiftInput.value = btn.dataset.shift;
        scaleInput.value = btn.dataset.scale;
        processPDF();
      });
    });

    pdfInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        currentFile = e.target.files[0];
        e.target.value = '';
        processPDF();
      }
    });

    [shiftInput, scaleInput, skipFirstInput].forEach(el => el.addEventListener('change', processPDF));

    shareBtn.addEventListener('click', async () => {
      if (!outputBlob) {
        statusEl.textContent = 'Сначала выберите PDF-файл синей кнопкой выше.';
        return;
      }
      const file = new File([outputBlob], outputFileName, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
        } catch (err) {}
      } else {
        window.open(openLink.href, '_blank');
      }
    });
  </script>
</body>
</html>
